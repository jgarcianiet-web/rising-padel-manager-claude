name: Pruebas y compilación

on:
  push:
    branches: [main]
    tags: ['v*']          # al publicar una etiqueta v3.0.1 se genera una Release con los instaladores
  pull_request:
  workflow_dispatch:      # botón para lanzarlo a mano desde la pestaña Actions

jobs:
  pruebas:
    name: Pruebas del juego
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Ejecutar la batería de pruebas
        run: node tests/smoke.js

  compilar:
    name: Compilar (${{ matrix.nombre }})
    needs: pruebas           # si las pruebas fallan, no se compila nada
    strategy:
      fail-fast: false
      matrix:
        include:
          - plataforma: windows-latest
            nombre: Windows
            args: ''
          - plataforma: macos-latest
            nombre: macOS
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.plataforma }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.plataforma == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cachear compilación de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar la aplicación
        run: npm run build -- ${{ matrix.args }}

      - name: Guardar los instaladores
        uses: actions/upload-artifact@v4
        with:
          name: padel-manager-${{ matrix.nombre }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Publicar en la Release (solo al etiquetar)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
          draft: true
          name: Pádel Manager ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
